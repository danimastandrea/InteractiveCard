<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Interactive Card</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="scss/style.css"
  />

</head>

<body>

  <main class="container">

    <!-- FORM -->

    <section class="form-section">

      <form id="Form" class="card-form">

        <h1>
          Register Your Card
        </h1>

        <!-- NAME -->

        <div class="input-group">

          <label for="cardName">
            Card Holder Name
          </label>

          <input
            type="text"
            id="cardName"
            placeholder="Jane Appleseed"
          />

        </div>

        <!-- CARD NUMBER -->

        <div class="input-group">

          <label for="cardNumber">
            Card Number
          </label>

          <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9123 0000"
            maxlength="19"
          />

        </div>

        <!-- ROW -->

        <div class="row">

          <!-- DATE -->

          <div class="input-group">

            <label for="dmInput">
              Exp. Date
            </label>

            <input
              type="text"
              id="dmInput"
              placeholder="MM/YY"
              maxlength="5"
            />

          </div>

          <!-- CVV -->

          <div class="input-group">

            <label for="cvvInput">
              CVV
            </label>

            <input
              type="text"
              id="cvvInput"
              placeholder="123"
              maxlength="3"
            />

          </div>

        </div>

        <!-- BUTTON -->

        <button type="submit" id="btn">
          Confirm
        </button>

        <!-- MESSAGE -->

        <div id="msg">
          Card added correctly
        </div>

      </form>

    </section>

    <!-- CARDS -->

    <section class="cards-section">

      <!-- FRONT CARD -->

      <article class="card front-card">

        <div class="card-top">

          <div class="card-logo"></div>

        </div>

        <div class="card-content">

          <h2 id="number">
            0000 0000 0000 0000
          </h2>

          <div class="card-details">

            <p id="name">
              Jane Appleseed
            </p>

            <p id="ddmm">
              00/00
            </p>

          </div>

        </div>

      </article>

      <!-- BACK CARD -->

      <article class="card back-card">

        <div class="black-strip"></div>

        <div class="cvv-box">

          <p id="cvv">
            000
          </p>

        </div>

      </article>

    </section>

  </main>

  <script src="index.js"></script>

</body>
</html>
